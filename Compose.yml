services:
  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
      api3:
        condition: service_started
    networks:
      - taskflow-network

  api1:
    build: .
    container_name: taskflow-api-1
    environment:
      NODE_ENV: production
      INSTANCE_NAME: api-1
      MONGODB_URL: mongodb://mongo:27017/taskflow
      REDIS_URL: redis://redis:6379
    expose:
      - "5000"
    networks:
      - taskflow-network

  api2:
    build: .
    container_name: taskflow-api-2
    environment:
      NODE_ENV: production
      INSTANCE_NAME: api-2
      MONGODB_URL: mongodb://mongo:27017/taskflow
      REDIS_URL: redis://redis:6379
    expose:
      - "5000"
    networks:
      - taskflow-network

  api3:
    build: .
    container_name: taskflow-api-3
    environment:
      NODE_ENV: production
      INSTANCE_NAME: api-3
      MONGODB_URL: mongodb://mongo:27017/taskflow
      REDIS_URL: redis://redis:6379
    expose:
      - "5000"
    networks:
      - taskflow-network

  mongo:
    image: mongo
    container_name: taskflow-mongo
    restart: unless-stopped
    volumes:
      - taskflow-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-network

  redis:
    image: redis:alpine
    container_name: taskflow-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - taskflow-network

volumes:
  taskflow-mongo:

networks:
  taskflow-network:
